<html lang="fr">

<head>

        }

        }

        h2 {

        p {

        .info {

            border-left: 4px solid #3498db;
            padding: 10px 15px;
            margin-top: 20px;

            border-radius: 4px;

        <h1>Exercice 4</h1>
